version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rentalwheels_postgres
    environment:
      POSTGRES_DB: rentalwheels_db
      POSTGRES_USER: rentalwheels_user
      POSTGRES_PASSWORD: rentalwheels_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rentalwheels_redis
    ports:
      - "6379:6379"

  ai_service:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    container_name: rentalwheels_ai_service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentalwheels_backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=rentalwheels_db
      - DB_USER=rentalwheels_user
      - DB_PASSWORD=rentalwheels_secret_password
      - DB_HOST=db
      - DB_PORT=5432
      - AI_SERVICE_URL=http://ai_service:8001
    depends_on:
      - db
      - redis
      - ai_service
    volumes:
      - ./backend/media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentalwheels_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
